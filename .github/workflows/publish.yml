name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for package identity change
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          BASE="$BEFORE_SHA"
          if [ "$EVENT_NAME" != "push" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD^ 2>/dev/null || echo "")
          fi
          PREV_ID=$(git show "$BASE":package.json 2>/dev/null | node -p "const p = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); p.name + '@' + p.version" 2>/dev/null || echo "")
          CURR_ID=$(node -p "const p = require('./package.json'); p.name + '@' + p.version")
          CURR_VERSION=$(node -p "require('./package.json').version")
          WORKFLOW_CHANGED=false
          if [ -n "$BASE" ] && ! git diff --quiet "$BASE" HEAD -- .github/workflows/publish.yml; then
            WORKFLOW_CHANGED=true
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$PREV_ID" != "$CURR_ID" ] || [ "$WORKFLOW_CHANGED" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURR_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.version.outputs.changed == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.version.outputs.changed == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: npm install --global npm@11.5.1
        if: steps.version.outputs.changed == 'true'
      - run: pnpm install --frozen-lockfile
        if: steps.version.outputs.changed == 'true'
      - run: pnpm run typecheck
        if: steps.version.outputs.changed == 'true'
      - run: pnpm run build
        if: steps.version.outputs.changed == 'true'
      - run: pnpm run lint
        if: steps.version.outputs.changed == 'true'
      - run: pnpm test
        if: steps.version.outputs.changed == 'true'
      - run: pnpm run test:e2e
        if: steps.version.outputs.changed == 'true'
      - name: Pack release artifacts
        if: steps.version.outputs.changed == 'true'
        run: |
          rm -rf release
          mkdir -p release/compat
          npm pack --ignore-scripts --pack-destination release
          mv release/*.tgz release/canonry-package.tgz
          tar -xzf release/canonry-package.tgz -C release/compat
          node -e "const fs = require('node:fs'); const path = 'release/compat/package/package.json'; const p = JSON.parse(fs.readFileSync(path, 'utf8')); p.name = '@ainyc/aeo-audit'; fs.writeFileSync(path, JSON.stringify(p, null, 2) + '\\n')"
          (cd release/compat/package && npm pack --ignore-scripts --pack-destination ../..)
          mv release/ainyc-aeo-audit-*.tgz release/ainyc-package.tgz
          mkdir -p release/canonry-unpacked release/ainyc-unpacked
          tar -xzf release/canonry-package.tgz -C release/canonry-unpacked
          tar -xzf release/ainyc-package.tgz -C release/ainyc-unpacked
          diff -qr --exclude=package.json release/canonry-unpacked/package release/ainyc-unpacked/package
          node -e "const assert = require('node:assert/strict'); const fs = require('node:fs'); const canonry = JSON.parse(fs.readFileSync('release/canonry-unpacked/package/package.json', 'utf8')); const ainyc = JSON.parse(fs.readFileSync('release/ainyc-unpacked/package/package.json', 'utf8')); const { name: canonryName, ...canonryRest } = canonry; const { name: ainycName, ...ainycRest } = ainyc; assert.equal(canonryName, '@canonry/aeo-audit'); assert.equal(ainycName, '@ainyc/aeo-audit'); assert.deepStrictEqual(canonryRest, ainycRest)"
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.changed == 'true'
        with:
          name: release-packages
          path: |
            release/canonry-package.tgz
            release/ainyc-package.tgz
          if-no-files-found: error

  publish-npm:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release
      - name: Publish publicly to npm
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          publish_package() {
            PACKAGE_NAME="$1"
            TARBALL="$2"
            ACTUAL_NAME=$(tar -xOf "$TARBALL" package/package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).name")
            ACTUAL_VERSION=$(tar -xOf "$TARBALL" package/package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version")
            if [ "$ACTUAL_NAME" != "$PACKAGE_NAME" ] || [ "$ACTUAL_VERSION" != "$VERSION" ]; then
              echo "Release artifact $TARBALL declares $ACTUAL_NAME@$ACTUAL_VERSION, expected $PACKAGE_NAME@$VERSION" >&2
              exit 1
            fi
            LOCAL_INTEGRITY=$(node -e "const { createHash } = require('node:crypto'); const { readFileSync } = require('node:fs'); console.log('sha512-' + createHash('sha512').update(readFileSync('$TARBALL')).digest('base64'))")
            REGISTRY_STDOUT=$(mktemp)
            REGISTRY_STDERR=$(mktemp)
            set +e
            npm view "$PACKAGE_NAME@$VERSION" dist.integrity --registry=https://registry.npmjs.org >"$REGISTRY_STDOUT" 2>"$REGISTRY_STDERR"
            REGISTRY_STATUS=$?
            set -e
            if [ "$REGISTRY_STATUS" -eq 0 ]; then
              REMOTE_INTEGRITY=$(cat "$REGISTRY_STDOUT")
              if ! printf '%s\n' "$REMOTE_INTEGRITY" | grep -Eq '^sha512-[A-Za-z0-9+/]+={0,2}$'; then
                cat "$REGISTRY_STDERR" >&2
                echo "Registry returned no valid sha512 integrity for $PACKAGE_NAME@$VERSION" >&2
                rm -f "$REGISTRY_STDOUT" "$REGISTRY_STDERR"
                exit 1
              fi
            elif grep -q 'E404' "$REGISTRY_STDERR"; then
              REMOTE_INTEGRITY=""
            else
              cat "$REGISTRY_STDERR" >&2
              rm -f "$REGISTRY_STDOUT" "$REGISTRY_STDERR"
              exit "$REGISTRY_STATUS"
            fi
            if [ -n "$REMOTE_INTEGRITY" ]; then
              if [ "$REMOTE_INTEGRITY" != "$LOCAL_INTEGRITY" ]; then
                echo "Registry artifact does not match $TARBALL" >&2
                rm -f "$REGISTRY_STDOUT" "$REGISTRY_STDERR"
                exit 1
              fi
              echo "$PACKAGE_NAME@$VERSION already exists on npm"
              rm -f "$REGISTRY_STDOUT" "$REGISTRY_STDERR"
              return
            fi
            rm -f "$REGISTRY_STDOUT" "$REGISTRY_STDERR"
            npm publish "./$TARBALL" --registry=https://registry.npmjs.org --access public --provenance
          }
          publish_package "@canonry/aeo-audit" "release/canonry-package.tgz"
          publish_package "@ainyc/aeo-audit" "release/ainyc-package.tgz"

  publish-clawhub:
    needs: [prepare, publish-npm]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Publish to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npx -y clawhub@0 login --token "$CLAWHUB_TOKEN" --no-browser
          CHANGELOG="$(git log -1 --pretty=%s)"
          npx -y clawhub@0 publish skills/aeo --version "$VERSION" --changelog "$CHANGELOG"
