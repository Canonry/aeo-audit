name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check for version change
        id: version
        run: |
          BASE=$(git log --pretty=format:'%H' -1 HEAD^ 2>/dev/null || echo "")
          PREV=$(git show "$BASE":package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "")
          CURR=$(node -p "require('./package.json').version")
          if [ "$PREV" != "$CURR" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURR" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.version.outputs.changed == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.version.outputs.changed == 'true'
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@canonry'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.version.outputs.changed == 'true'
      - run: pnpm run typecheck
        if: steps.version.outputs.changed == 'true'
      - run: pnpm run build
        if: steps.version.outputs.changed == 'true'
      - run: pnpm run lint
        if: steps.version.outputs.changed == 'true'
      - run: pnpm test
        if: steps.version.outputs.changed == 'true'
      - run: pnpm run test:e2e
        if: steps.version.outputs.changed == 'true'
      - run: npm publish
        if: steps.version.outputs.changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to ClawHub
        if: steps.version.outputs.changed == 'true'
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npx -y clawhub@0 login --token "$CLAWHUB_TOKEN" --no-browser
          CHANGELOG="$(git log -1 --pretty=%s)"
          npx -y clawhub@0 publish skills/aeo --version "$VERSION" --changelog "$CHANGELOG"
